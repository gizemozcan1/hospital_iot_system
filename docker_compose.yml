services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hospital_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t test/health -m ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: hospital_postgres
    environment:
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_pass
      POSTGRES_DB: hospital_iot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_user -d hospital_iot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: hospital_backend
    environment:
      DATABASE_URL: postgresql://iot_user:iot_pass@postgres:5432/hospital_iot
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  simulator:
    build: ./simulator
    container_name: hospital_simulator
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      DEVICE_ID: node_01
      PUBLISH_INTERVAL: "3.0"
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  pgdata: